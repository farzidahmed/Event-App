name: llr
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.9+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  get_storage: ^2.1.1
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  flutter_displaymode: ^0.7.0
  auto_animated: ^3.2.0
  dio: ^5.9.0
  rxdart: ^0.27.7
  intl: ^0.20.2
  device_info_plus: ^12.1.0
  get_it: ^8.2.0
  flutter_svg: ^2.2.1
  dropdown_button2: ^2.3.9

  pinput: ^5.0.2
  slide_countdown: ^2.0.2
  image_picker: ^1.2.0
  google_fonts: ^6.3.2
  flutter_rating_bar: ^4.0.1
  dart_pusher_channels: ^1.2.3
  file_picker: ^10.3.10
  image: ^4.8.0
  fluttertoast: ^9.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_widget_from_html: ^0.17.2
  change_app_package_name: ^1.5.0
  video_player: ^2.12.0
  path_provider: ^2.1.6
  mime: ^2.0.0
  http_parser: ^4.1.2


dev_dependencies:
  build_runner:
  flutter_gen_runner:
  dart_style: ^3.0.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_gen:
  # Optional
  output: lib/gen/
  # Optional
  line_length: 80


  colors:
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf  
